<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" width="1440" height="760" role="img" aria-labelledby="t d"><title id="t">Flujo sistemático de la fase de yuxtaposición</title><desc id="d">Cinco pasos: alineación de criterios, extracción de datos, construcción de matriz, gestión de vacíos y transición al análisis. Ejemplo inferior de una tabla por criterios y países.</desc><rect width="1440" height="760" fill="#ffffff"/><text x="720" y="65" text-anchor="middle" font-family="Arial,sans-serif" font-size="43" font-weight="700" fill="#1f3d66">Flujo sistemático de la fase de yuxtaposición</text><path d="M120 85H1320" stroke="#2995bc" stroke-width="4"/><text x="720" y="120" font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#273e55">Organizar en paralelo los datos de cada país, mediante criterios e indicadores comunes.</text><g font-family="Arial,sans-serif"><rect x="44" y="157" width="268" height="317" rx="18" fill="#f7fbfd" stroke="#d3e2eb" stroke-width="2"/><rect x="44" y="157" width="268" height="8" rx="4" fill="#2584bb"/><text x="178" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">1. Alineación</text><text x="178" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">de criterios</text><text x="178" y="262" text-anchor="middle" font-size="16" fill="#2c4052">Definir dimensiones</text><text x="178" y="283" text-anchor="middle" font-size="16" fill="#2c4052">e indicadores comunes</text><g transform="translate(67 309)"><path d="M5 78H206" stroke="#2584bb" stroke-width="5"/><rect x="22" y="23" width="29" height="42" rx="5" fill="#92cce1" stroke="#1f3d66" stroke-width="2"/><rect x="65" y="39" width="29" height="26" rx="5" fill="#55a8cc" stroke="#1f3d66" stroke-width="2"/><rect x="108" y="10" width="29" height="55" rx="5" fill="#bce2eb" stroke="#1f3d66" stroke-width="2"/><rect x="151" y="30" width="29" height="35" rx="5" fill="#edc35f" stroke="#1f3d66" stroke-width="2"/><path d="M36 12h140" stroke="#51718d" stroke-dasharray="4 5" stroke-width="2"/></g></g><path d="M314 401h12m-6-6 6 6-6 6" fill="none" stroke="#d71920" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><rect x="328" y="157" width="268" height="317" rx="18" fill="#f7fbfd" stroke="#d3e2eb" stroke-width="2"/><rect x="328" y="157" width="268" height="8" rx="4" fill="#26a2b4"/><text x="462" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">2. Extracción</text><text x="462" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">de datos</text><text x="462" y="262" text-anchor="middle" font-size="16" fill="#2c4052">Seleccionar información</text><text x="462" y="283" text-anchor="middle" font-size="16" fill="#2c4052">de las fuentes verificadas</text><g transform="translate(351 309)"><path d="M17 9h72l19 21v84H17Z" fill="#eaf4fa" stroke="#1f3d66" stroke-width="3"/><path d="M89 9v24h20" fill="none" stroke="#1f3d66" stroke-width="3"/><path d="M31 47h60M31 60h60M31 73h39" stroke="#3c87ac" stroke-width="4" stroke-linecap="round"/><path d="M119 53h73v68h-73Z" fill="#dff2f4" stroke="#1f3d66" stroke-width="3"/><path d="M131 71h50M131 85h50M131 99h34" stroke="#269caf" stroke-width="4" stroke-linecap="round"/><path d="M108 84h11" stroke="#e4a32e" stroke-width="4"/></g></g><path d="M598 401h12m-6-6 6 6-6 6" fill="none" stroke="#d71920" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><rect x="612" y="157" width="268" height="317" rx="18" fill="#f7fbfd" stroke="#d3e2eb" stroke-width="2"/><rect x="612" y="157" width="268" height="8" rx="4" fill="#42ac98"/><text x="746" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">3. Construcción</text><text x="746" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">de matriz</text><text x="746" y="262" text-anchor="middle" font-size="16" fill="#2c4052">Filas por criterio y</text><text x="746" y="283" text-anchor="middle" font-size="16" fill="#2c4052">columnas por país</text><g transform="translate(635 309)"><rect x="3" y="10" width="211" height="111" fill="#fff" stroke="#1f3d66" stroke-width="3" rx="4"/><path d="M3 42H214M3 71H214M3 98H214M73 10V121M145 10V121" stroke="#1f3d66" stroke-width="2.5"/><path d="M4 12h209v29H4Z" fill="#dcebf7"/><path d="M74 43h70v28H74ZM146 72h67v26h-67Z" fill="#a7e1e2"/><path d="M84 54h49M156 83h47M84 84h49" stroke="#4186ae" stroke-width="4" stroke-linecap="round"/></g></g><path d="M882 401h12m-6-6 6 6-6 6" fill="none" stroke="#d71920" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><rect x="896" y="157" width="268" height="317" rx="18" fill="#f7fbfd" stroke="#d3e2eb" stroke-width="2"/><rect x="896" y="157" width="268" height="8" rx="4" fill="#e7a52a"/><text x="1030" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">4. Gestión</text><text x="1030" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">de vacíos</text><text x="1030" y="262" text-anchor="middle" font-size="16" fill="#2c4052">Registrar cuando faltan</text><text x="1030" y="283" text-anchor="middle" font-size="16" fill="#2c4052">datos documentados</text><g transform="translate(919 309)"><rect x="1" y="15" width="211" height="112" rx="5" fill="#fff" stroke="#1f3d66" stroke-width="3"/><path d="M1 44h211M72 15v112M142 15v112M1 73h211M1 101h211" stroke="#4d7ca0" stroke-width="2"/><path d="M74 74h67v25H74Z" fill="#fff1df"/><path d="M143 45h67v26h-67Z" fill="#f9c99d"/><path d="M98 74l10-17 10 17Z" fill="#e59d3b" stroke="#9e4f2d" stroke-width="2"/><text x="108" y="71" font-size="12" text-anchor="middle" fill="#fff" font-weight="700">!</text></g></g><path d="M1166 401h12m-6-6 6 6-6 6" fill="none" stroke="#d71920" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial,sans-serif"><rect x="1180" y="157" width="268" height="317" rx="18" fill="#f7fbfd" stroke="#d3e2eb" stroke-width="2"/><rect x="1180" y="157" width="268" height="8" rx="4" fill="#dd6747"/><text x="1314" y="202" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">5. Transición</text><text x="1314" y="228" text-anchor="middle" font-size="23" font-weight="700" fill="#182f47">al análisis</text><text x="1314" y="262" text-anchor="middle" font-size="16" fill="#2c4052">Examinar semejanzas,</text><text x="1314" y="283" text-anchor="middle" font-size="16" fill="#2c4052">diferencias y tendencias</text><g transform="translate(1203 309)"><path d="M25 91h190" stroke="#1f3d66" stroke-width="3"/><rect x="48" y="62" width="29" height="29" fill="#81c8d0" stroke="#1f3d66" stroke-width="2"/><rect x="92" y="42" width="29" height="49" fill="#e9bd62" stroke="#1f3d66" stroke-width="2"/><rect x="136" y="22" width="29" height="69" fill="#e78b76" stroke="#1f3d66" stroke-width="2"/><path d="M40 60l49-29 43 7 51-29" fill="none" stroke="#1f3d66" stroke-width="4"/><path d="M174 9h10v10" fill="none" stroke="#1f3d66" stroke-width="4"/></g></g><g font-family="Arial,sans-serif"><text x="720" y="520" font-size="22" fill="#1f3d66" text-anchor="middle" font-weight="700">Así organizamos la información en una matriz</text><rect x="318" y="546" width="804" height="158" rx="8" fill="#fff" stroke="#1f3d66" stroke-width="3"/><path d="M318 588H1122M318 647H1122M585 546V704M854 546V704" stroke="#1f3d66" stroke-width="2"/><path d="M321 549h798v37H321Z" fill="#1f3d66"/><g font-size="18" font-weight="700" fill="#fff"><text x="450" y="576" text-anchor="middle">Criterio / indicador</text><text x="718" y="576" text-anchor="middle">País 1</text><text x="987" y="576" text-anchor="middle">País 2</text></g><g font-size="16" fill="#283d54" text-anchor="middle"><text x="450" y="623">Criterio 1</text><text x="718" y="623">Datos verificados</text><text x="987" y="623">Datos verificados</text><text x="450" y="680">Criterio 2</text><text x="718" y="680">Sin datos documentados</text><text x="987" y="680">Datos verificados</text></g><rect x="587" y="648" width="265" height="54" fill="#fff1e5" opacity=".85"/><text x="720" y="738" font-size="15" fill="#4d6578" text-anchor="middle">La matriz prepara el análisis; no sustituye la comparación crítica posterior.</text></g></svg>