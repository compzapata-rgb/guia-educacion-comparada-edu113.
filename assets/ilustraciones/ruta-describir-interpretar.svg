<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="rt rd"><title id="rt">Ruta para describir e interpretar información</title><desc id="rd">Infografía horizontal en seis pasos: leer la fuente; seleccionar datos; describir; analizar el contexto; interpretar; revisar la redacción. Los primeros tres pasos preparan la descripción y los siguientes tres desarrollan la interpretación y la revisión.</desc><defs><linearGradient id="rbg" x2="1" y2="1"><stop stop-color="#f3f9fc"/><stop offset="1" stop-color="#eaf4fa"/></linearGradient></defs><rect width="1120" height="350" rx="24" fill="url(#rbg)"/><g font-family="Arial,sans-serif"><text x="36" y="43" fill="#1f3d66" font-size="24" font-weight="700">Del documento a una explicación fundamentada</text><text x="36" y="72" fill="#516c80" font-size="15">Primero identificamos los hechos; después examinamos qué significan en su contexto.</text><g transform="translate(36 113)"><rect width="160" height="160" rx="16" fill="#fff" stroke="#aac9dc" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#e0eff8"/><path d="M70 37h19v24H70zM74 43h11m-11 6h11" fill="none" stroke="#1f3d66" stroke-width="2.5"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">1. Leer</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">la fuente</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">Comprender</text></g><g transform="translate(211 113)"><rect width="160" height="160" rx="16" fill="#fff" stroke="#aac9dc" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#e0eff8"/><path d="M65 38h31M65 46h25M65 54h31" fill="none" stroke="#1f3d66" stroke-width="3" stroke-linecap="round"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">2. Seleccionar</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">datos útiles</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">Verificar</text></g><g transform="translate(386 113)"><rect width="160" height="160" rx="16" fill="#e7f3fa" stroke="#6299b8" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#cce6f3"/><path d="M68 58L93 33m-11-3l14 14m-30 18h30" stroke="#1f3d66" stroke-width="3" fill="none" stroke-linecap="round"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">3. Describir</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">los hechos</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">¿Qué dice?</text></g><g transform="translate(561 113)"><rect width="160" height="160" rx="16" fill="#fff" stroke="#aac9dc" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#e0eff8"/><circle cx="80" cy="45" r="13" fill="none" stroke="#1f3d66" stroke-width="3"/><path d="M91 57l8 9" stroke="#1f3d66" stroke-width="3"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">4. Examinar</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">el contexto</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">Buscar razones</text></g><g transform="translate(736 113)"><rect width="160" height="160" rx="16" fill="#e7f3fa" stroke="#6299b8" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#cce6f3"/><path d="M68 49l10 9 16-20" fill="none" stroke="#1f3d66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">5. Interpretar</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">con evidencias</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">¿Qué significa?</text></g><g transform="translate(911 113)"><rect width="160" height="160" rx="16" fill="#fff" stroke="#aac9dc" stroke-width="2"/><circle cx="80" cy="48" r="24" fill="#e0eff8"/><path d="M69 41l6 6 15-17M68 56h29M68 63h23" fill="none" stroke="#1f3d66" stroke-width="3" stroke-linecap="round"/><text x="80" y="94" text-anchor="middle" fill="#1f3d66" font-size="17" font-weight="700">6. Revisar</text><text x="80" y="116" text-anchor="middle" fill="#445f74" font-size="14">la redacción</text><text x="80" y="138" text-anchor="middle" fill="#445f74" font-size="12">Dar claridad</text></g><g stroke="#d71920" stroke-width="3" fill="none" stroke-linecap="round"><path d="M198 192h10m-6-5 6 5-6 5M373 192h10m-6-5 6 5-6 5M548 192h10m-6-5 6 5-6 5M723 192h10m-6-5 6 5-6 5M898 192h10m-6-5 6 5-6 5"/></g><rect x="36" y="297" width="510" height="31" rx="10" fill="#dcecf5"/><rect x="561" y="297" width="510" height="31" rx="10" fill="#dcecf5"/><text x="291" y="318" text-anchor="middle" fill="#1f3d66" font-size="14" font-weight="700">PREPARACIÓN Y DESCRIPCIÓN</text><text x="816" y="318" text-anchor="middle" fill="#1f3d66" font-size="14" font-weight="700">INTERPRETACIÓN Y REVISIÓN</text></g></svg>